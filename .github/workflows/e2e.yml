name: Site E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: 'Optional site slug filter (e.g. media-craft, playmint, tensift). Leave blank to run all.'
        required: false
        default: ''
  schedule:
    # Daily polite smoke check at 22:17 UTC (06:17 Asia/Taipei)
    - cron: '17 22 * * *'

concurrency:
  group: site-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          SITE_FILTER: ${{ inputs.site || '' }}
        run: |
          if [ -n "$SITE_FILTER" ]; then
            [[ "$SITE_FILTER" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Invalid site slug filter"; exit 1; }
            npx playwright test "suites/${SITE_FILTER}/"
          else
            npx playwright test
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/report.json
          retention-days: 14
